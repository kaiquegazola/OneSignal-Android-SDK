# JitPack build for the kaiquegazola fork (no auto-init).
# Gradle root is OneSignalSDK/. Artifacts: com.github.kaiquegazola.OneSignal-Android-SDK:<module>:<tag>
# :kmp is not republished; core depends on the unchanged com.onesignal:kmp from Maven Central.
jdk:
  - openjdk17
before_install:
  - git submodule update --init --recursive
install:
  - cd OneSignalSDK && ./gradlew --no-daemon --no-configuration-cache -PPUBLISH_GROUP=com.github.kaiquegazola.OneSignal-Android-SDK -PPUBLISH_VERSION=$VERSION :OneSignal:core:publishToMavenLocal :OneSignal:notifications:publishToMavenLocal :OneSignal:in-app-messages:publishToMavenLocal :OneSignal:location:publishToMavenLocal :OneSignal:publishToMavenLocal
